name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "prerelease"
        type: choice
        options:
          - prerelease
          - release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Build Packages
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Enter prerelease mode (idempotent)
        if: github.event.inputs.release_type == 'prerelease'
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "Already in prerelease mode; skipping"
          else
            npm run changeset pre enter beta
          fi

      - name: Exit prerelease mode if active (for stable releases)
        if: github.event.inputs.release_type == 'release'
        run: |
          if [ -f .changeset/pre.json ]; then
            npm run changeset pre exit
          else
            echo "Not in prerelease mode; skipping"
          fi

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
